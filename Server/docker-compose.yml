services:
  server:
    build:
      dockerfile: Server/Dockerfile
    container_name: ${SERVER_HOSTNAME:-server}
    environment:
      - SERVER_HOSTNAME=${SERVER_HOSTNAME:-server}
      - SERVER_PORT=${SERVER_PORT:-5000}
    volumes:
      - ./ServerFiles:/app/Images
    tty: true
    stdin_open: true
  
  client:
    build:
      dockerfile: Client/Dockerfile
    container_name: ${CLIENT_HOSTNAME:-client}
    environment:
      - CLIENT_HOSTNAME=${CLIENT_HOSTNAME:-client}
      - CLIENT_PORT=${CLIENT_PORT:-0}
      - SERVER_HOSTNAME=${SERVER_HOSTNAME:-server}
      - SERVER_PORT=${SERVER_PORT:-5000}
    volumes:
      - ./ClientFiles:/app/ClientFiles
    depends_on:
      - server
    tty: true
    stdin_open: true

## Para levantar los contenedores en segundo plano: docker compose up -d
## Luego para correr el cliente: docker compose exec client dotnet /app/publish/Client.dll