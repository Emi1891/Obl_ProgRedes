syntax = "proto3";

option csharp_namespace = "Servidor_de_Chat";

package auth;

service AuthService {
  rpc ValidateCredentials (ValidateRequest) returns (ValidateResponse);
  rpc ValidateClassLink (ClassLinkRequest) returns (ClassLinkResponse);
}

message ValidateRequest {
  string username = 1;
  string password = 2;
}

message ValidateResponse {
  bool valid = 1;
  string message = 2;
}

message ClassLinkRequest {
  string link = 1;
}

message ClassLinkResponse {
  bool valid = 1;
  string className = 2;
  string message = 3;
}

